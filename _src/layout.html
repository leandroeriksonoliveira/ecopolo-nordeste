<!doctype html>
<html lang="{{html_lang}}" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="{{canonical}}" />
{{hreflang_links}}
    <meta name="robots" content="{{robots}}" />
    <meta name="author" content="{{site_legal_name}}" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />

    <!-- Open Graph -->
    <meta property="og:type" content="{{og_type}}" />
    <meta property="og:site_name" content="{{site_name}}" />
    <meta property="og:locale" content="{{og_locale}}" />
    <meta property="og:locale:alternate" content="{{og_locale_alt}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{canonical}}" />
    <meta property="og:image" content="{{og_image_url}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{og_image_alt}}" />
    <meta property="article:publisher" content="{{site_linkedin}}" />
    <meta property="og:see_also" content="{{site_linkedin}}" />
    <meta property="og:see_also" content="{{site_instagram}}" />

    <!-- Share card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="{{og_image_url}}" />
    <meta name="twitter:image:alt" content="{{og_image_alt}}" />

    <!-- Browser & app identity -->
    <link rel="icon" href="{{asset_prefix}}assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="{{asset_prefix}}assets/img/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="{{asset_prefix}}assets/img/apple-touch-icon.png" />
    <link rel="manifest" href="{{asset_prefix}}manifest.webmanifest" />

    <link rel="stylesheet" href="{{asset_prefix}}assets/css/site.min.css?v={{asset_v}}" />
{{jsonld}}
    <script>
      document.documentElement.classList.remove("no-js");
    </script>
{{head_extra}}
  </head>
  <body class="{{body_class}}">
    <a class="skip-link" href="#conteudo">{{skip_label}}</a>

    <div class="scroll-progress" aria-hidden="true">
      <div class="scroll-progress__bar" data-scroll-progress></div>
    </div>

{{partial:header}}

    <main id="conteudo">
{{body}}
    </main>

{{partial:footer}}

{{partial:consent}}

{{partial:icons}}

    <script src="{{asset_prefix}}assets/js/config.js?v={{asset_v}}"></script>
    <script src="{{asset_prefix}}assets/js/consent.js?v={{asset_v}}" defer></script>
    <script src="{{asset_prefix}}assets/js/site.js?v={{asset_v}}" defer></script>
  </body>
</html>
