          <div class="lang-switch" role="group" aria-label="{{lang_switch_label}}">
            <a
              class="lang-switch__item"
              href="{{pt_href}}"
              hreflang="pt-BR"
              lang="pt-BR"{{pt_current_attr}}
            >
              <svg class="lang-switch__flag" viewBox="0 0 24 16" aria-hidden="true" focusable="false">
                <rect width="24" height="16" fill="#009b3a" />
                <polygon points="12,2 22,8 12,14 2,8" fill="#fedf00" />
                <circle cx="12" cy="8" r="3.6" fill="#002776" />
                <path d="M8.6 7.3a4.6 4.6 0 0 1 6.8 1.2" fill="none" stroke="#ffffff" stroke-width="0.7" />
              </svg>
              <span>PT</span><span class="visually-hidden"> (Português)</span>
            </a>
            <a
              class="lang-switch__item"
              href="{{en_href}}"
              hreflang="en"
              lang="en"{{en_current_attr}}
            >
              <svg class="lang-switch__flag" viewBox="0 0 24 16" aria-hidden="true" focusable="false">
                <rect width="24" height="16" fill="#012169" />
                <path d="M0 0L24 16M24 0L0 16" stroke="#ffffff" stroke-width="3.2" />
                <path d="M0 0L24 16M24 0L0 16" stroke="#c8102e" stroke-width="1.6" />
                <path d="M12 0V16M0 8H24" stroke="#ffffff" stroke-width="5.2" />
                <path d="M12 0V16M0 8H24" stroke="#c8102e" stroke-width="3" />
              </svg>
              <span>EN</span><span class="visually-hidden"> (English)</span>
            </a>
          </div>
