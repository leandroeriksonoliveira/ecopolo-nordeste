    <header class="site-header" data-site-header>
      <div class="wrap site-header__inner">
        <a class="brand" href="index.html" aria-label="{{site_name}} — página inicial">
          <span class="brand__mark">{{partial:logo_mark}}</span>
          <span class="brand__word">{{partial:logo_word}}</span>
        </a>

        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="nav-principal"
          data-nav-toggle
        >
          <span class="nav-toggle__bars" aria-hidden="true"></span>
          <span data-nav-toggle-label>Menu</span>
        </button>

        <nav class="nav" id="nav-principal" aria-label="Navegação principal" data-nav>
          <ul class="nav__list">
          {{nav_items}}
          </ul>

          <!-- Perfis oficiais: links diretos para os perfis reais, em nova aba. -->
          <ul class="header-social" aria-label="Perfis oficiais da Eco Polo Nordeste">
            <li>
              <a
                href="{{site_linkedin}}"
                target="_blank"
                rel="noopener noreferrer external"
                aria-label="LinkedIn da Eco Polo Nordeste — abre em nova aba"
              >
                <svg aria-hidden="true" focusable="false"><use href="#i-linkedin" /></svg>
                <span class="header-social__handle">{{site_linkedin_handle}}</span>
              </a>
            </li>
            <li>
              <a
                href="{{site_instagram}}"
                target="_blank"
                rel="noopener noreferrer external"
                aria-label="Instagram da Eco Polo Nordeste — abre em nova aba"
              >
                <svg aria-hidden="true" focusable="false"><use href="#i-instagram" /></svg>
                <span class="header-social__handle">{{site_instagram_handle}}</span>
              </a>
            </li>
          </ul>

          <div class="nav__cta">
            <a class="btn btn--gold btn--sm" href="contato.html">
              Fale com a equipe
              <svg class="btn__arrow" width="18" height="18" aria-hidden="true" focusable="false"><use href="#i-arrow" /></svg>
            </a>
          </div>
        </nav>
      </div>
    </header>
